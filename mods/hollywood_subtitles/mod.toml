# Hollywood Subtitles: a mod for Conker's Bad Fur Day: Recompiled.

[manifest]
id = "conker_hollywood_subtitles"
version = "0.1.0"
display_name = "Hollywood Subtitles"
description = """
Shows movie-style subtitles along the screen while characters speak, like a film. Conker's Bad Fur \
Day is fully voice acted and draws no dialogue text, so the lines come from a transcript shipped \
with the mod, timed by the game's own voice playback. This first version covers the intro (the \
chainsaw opening and Conker's throne-room monologue); more of the script follows. You can turn the \
intro and the rest of the game on separately, and change where the text sits, its size, its color \
and its background."""
short_description = "Movie-style subtitles for the voice acting."
authors = [ "Conker Recomp" ]
game_id = "conker"
minimum_recomp_version = "0.1.0"
dependencies = []
optional_dependencies = []
native_libraries = []

[inputs]
elf_path = "build/mod.elf"
mod_filename = "conker_hollywood_subtitles"
func_reference_syms_file = "../syms/conker.us.syms.toml"
data_reference_syms_files = [ "../syms/conker.us.datasyms.toml" ]
additional_files = [ "thumb.png" ]

# --- The three main toggles ---------------------------------------------------------------------

[[manifest.config_options]]
id = "enabled"
name = "Enable Subtitles"
description = "The master switch. With this off, no subtitles show, whatever the options below say."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "intro_subtitles"
name = "Intro Cutscene Subtitles"
description = "Subtitles during the intro: the chainsaw opening and Conker's throne-room monologue (\"Well, here I am. King...\")."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "general_subtitles"
name = "General Game Subtitles"
description = "Subtitles during the rest of the game's cutscenes and conversations (as much of the script as the mod covers so far)."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "hide_bubbles"
name = "Hide Speech Bubbles"
description = "Don't draw the game's comic speech bubbles, so the subtitles replace them. The dialogue still plays exactly as before (it still waits for B where the game does). Lines that have no subtitle yet show no text at all with this on."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

# --- Customization ------------------------------------------------------------------------------

[[manifest.config_options]]
id = "position"
name = "Position"
description = "Where the subtitles sit on the screen."
type = "Enum"
options = [ "Bottom", "Top", "Middle" ]
default = "Bottom"

[[manifest.config_options]]
id = "size"
name = "Text Size"
description = "How large the subtitle text is."
type = "Enum"
options = [ "Small", "Normal", "Large" ]
default = "Normal"

[[manifest.config_options]]
id = "background"
name = "Background Box"
description = "A dark box behind the text, to keep it readable over a bright scene. Higher is more opaque; None draws the text alone."
type = "Enum"
options = [ "None", "Light", "Medium", "Dark" ]
default = "Medium"

[[manifest.config_options]]
id = "color"
name = "Text Color"
description = "The subtitle text color."
type = "Enum"
options = [ "White", "Yellow", "Cyan", "Green" ]
default = "White"

[[manifest.config_options]]
id = "debug_segments"
name = "Debug: Voice Clips"
description = "For writing the subtitles: while a clip with subtitles plays, shows its ROM address and how far into it the voice is ([0x015E1FD8 12.34s]) before the line. The terminal logs each clip that starts either way, with or without subtitles for it."
type = "Enum"
options = [ "Off", "On" ]
default = "Off"

[[manifest.config_options]]
id = "capture"
name = "Dev: Capture Voice Clips to File"
description = "For building the transcript: logs every voice clip that plays (its scene, ROM address, order and length) to voice_segments.txt in the game's data folder, so an offline tool can pair them with the game's speech-bubble text. Leave Off for normal play."
type = "Enum"
options = [ "Off", "On" ]
default = "Off"

[[manifest.config_options]]
id = "navigate"
name = "Dev: Auto Play All Dialogues"
description = "For building the transcript: teleports straight to every dialogue in the game (all 483 scene scripts, no save progress needed), plays each and logs its voice clips, timings and how it ended to voice_segments.txt in the game's data folder. It doesn't press B through speech bubbles; a dialogue that stalls is ended with L (keep Skip Any Cutscene on). If a dialogue crashes the game, relaunch: it resumes past it. Leave Off for normal play."
type = "Enum"
options = [ "Off", "On" ]
default = "Off"

[[manifest.config_options]]
id = "navigate_skip_done"
name = "Dev: Auto Play Skips Captured Dialogues"
description = "With Auto Play All Dialogues: pass over the dialogues voice_segments.txt already has played to their end, so a capture can be collected over several sittings without replaying (or skipping by hand) what's done. Dialogues that were skipped or stalled are played again."
type = "Enum"
options = [ "Off", "On" ]
default = "On"
